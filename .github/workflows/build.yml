name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW-w64 & Raylib
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-raylib

      - name: Compile Standalone EXE
        shell: msys2 {0}
        run: |
          g++ main.cpp -o KineticStrike.exe -O3 -std=c++17 -static -lraylib -lopengl32 -lgdi32 -lwinmm -mwindows

      - name: Upload Playable Game Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KineticStrike-Windows-x64
          path: KineticStrike.exe
